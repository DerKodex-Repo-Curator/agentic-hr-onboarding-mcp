<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI onboarding logical architecture</title>
  <desc id="desc">Logical architecture for the onboarding command center, showing browser intake, FastAPI runtime, agent orchestration, MCP connectors, cloud systems, and evidence stores.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .band { fill: #ffffff; stroke: #d7e0e7; stroke-width: 1.4; }
      .node { fill: #ffffff; stroke: #b8c7d1; stroke-width: 1.5; }
      .node-dark { fill: #14212b; stroke: #14212b; }
      .node-teal { fill: #e7f4f1; stroke: #0f6f68; }
      .node-blue { fill: #eef4ff; stroke: #2b63c6; }
      .node-amber { fill: #fff7e6; stroke: #b7791f; }
      .node-green { fill: #edf7ed; stroke: #2f7d47; }
      .title { fill: #111827; font: 700 18px Inter, Arial, sans-serif; }
      .label { fill: #24313b; font: 700 14px Inter, Arial, sans-serif; }
      .small { fill: #61707c; font: 12px Inter, Arial, sans-serif; }
      .white { fill: #ffffff; }
      .arrow { stroke: #60717d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #9aa9b4; stroke-width: 1.7; fill: none; marker-end: url(#arrowSoft); }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#60717d" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa9b4" />
    </marker>
  </defs>

  <rect class="bg" width="1180" height="620" rx="0" />
  <text x="36" y="44" class="title">Enterprise AI Onboarding Agent - Logical Architecture</text>
  <text x="36" y="67" class="small">Author: Sarala Biswal</text>

  <rect x="30" y="96" width="210" height="430" rx="8" class="band" />
  <text x="52" y="126" class="label">Business User</text>
