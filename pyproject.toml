# Author: Sarala Biswal

[project]
name = "enterprise-ai-agent-poc"
version = "0.1.0"
description = "Enterprise employee onboarding AI agent POC with MCP stubs"
authors = [{ name = "Sarala Biswal" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "crewai>=0.30.0",
  "langchain>=0.2.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "aiosqlite>=0.20.0",
  "python-dotenv>=1.0.0",
  "slack-sdk>=3.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
